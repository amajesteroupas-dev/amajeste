# Projeto isolado: não sobrescreve outros sites no KVM.
# - Postgres/Redis NÃO publicam portas no host
# - App só em 127.0.0.1:3001 (proxy do servidor aponta para cá)
# - Sem Nginx próprio na 80/443 (usa o proxy que já existe no KVM)

name: majeste

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: majeste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-majeste_secret}
      POSTGRES_DB: majeste
    volumes:
      - majeste_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majeste -d majeste"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - majeste_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - majeste_redis_data:/data
    networks:
      - majeste_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://majeste:${POSTGRES_PASSWORD:-majeste_secret}@postgres:5432/majeste?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://amajeste.com.br}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@amajeste.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      PAGSEGURO_TOKEN: ${PAGSEGURO_TOKEN:-}
      PAGSEGURO_SANDBOX: ${PAGSEGURO_SANDBOX:-false}
      INFINITYPAY_HANDLE: ${INFINITYPAY_HANDLE:-}
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-}
      MELHOR_ENVIO_SANDBOX: ${MELHOR_ENVIO_SANDBOX:-false}
      MELHOR_ENVIO_USER_AGENT: ${MELHOR_ENVIO_USER_AGENT:-Majeste Fitness (contato@equilibra.tech)}
      STORE_ZIP: ${STORE_ZIP:-01310100}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://amajeste.com.br}
      NEXT_PUBLIC_SITE_NAME: Majesté
    volumes:
      - majeste_uploads:/app/uploads
    ports:
      # Só localhost — não compete com outros sites
      - "127.0.0.1:3001:3000"
    networks:
      - majeste_net

volumes:
  majeste_postgres_data:
  majeste_redis_data:
  majeste_uploads:

networks:
  majeste_net:
    name: majeste_net
    driver: bridge
