<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Majesté">
  <!-- Fundo creme -->
  <rect width="64" height="64" rx="12" fill="#F5F2EA"/>

  <!-- Coroa clássica dourada, pontas para CIMA, bem legível em 16–32px -->
  <g>
    <!-- Corpo preenchido -->
    <path
      d="M8 46
         L14 18
         L24 34
         L32 10
         L40 34
         L50 18
         L56 46
         Z"
      fill="#D4AF37"
      stroke="#8B6914"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Base -->
    <rect x="9" y="45" width="46" height="6" rx="1.5" fill="#C9A227" stroke="#8B6914" stroke-width="1"/>
    <rect x="12" y="52" width="40" height="3" rx="1" fill="#A8842F"/>
    <!-- Orbes (topo das pontas) -->
    <circle cx="14" cy="17" r="3.5" fill="#F0D878" stroke="#8B6914" stroke-width="1"/>
    <circle cx="32" cy="9" r="4" fill="#FFE9A0" stroke="#8B6914" stroke-width="1"/>
    <circle cx="50" cy="17" r="3.5" fill="#F0D878" stroke="#8B6914" stroke-width="1"/>
  </g>
</svg>
