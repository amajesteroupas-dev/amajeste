<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Majesté">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a322c"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="gold" x1="10" y1="8" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e8d090"/>
      <stop offset="55%" stop-color="#d4af5a"/>
      <stop offset="78%" stop-color="#b8923f"/>
      <stop offset="100%" stop-color="#8a6a28"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="32" y1="10" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="100%" stop-color="#c9a24a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app-icon tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="12.8" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.55"/>

  <!-- Crown — filled silhouette for readability at 16px -->
  <g filter="url(#glow)" transform="translate(0 1)">
    <path
      d="M12 44.5
         L16.5 22.5
         L24 34
         L32 12.5
         L40 34
         L47.5 22.5
         L52 44.5
         Z"
      fill="url(#gold)"
      stroke="url(#goldSoft)"
      stroke-width="1.1"
      stroke-linejoin="round"
    />
    <!-- Center jewel plate -->
    <path
      d="M24 34 L32 22 L40 34 L32 41.5 Z"
      fill="url(#goldSoft)"
      opacity="0.92"
    />
    <!-- Band -->
    <rect x="13.5" y="44" width="37" height="4.2" rx="1.2" fill="url(#gold)"/>
    <rect x="16.5" y="48.8" width="31" height="2.2" rx="1" fill="url(#gold)" opacity="0.75"/>
    <!-- Peaks jewels -->
    <circle cx="16.5" cy="21.5" r="3.1" fill="url(#goldSoft)"/>
    <circle cx="32" cy="11.2" r="3.5" fill="url(#goldSoft)"/>
    <circle cx="47.5" cy="21.5" r="3.1" fill="url(#goldSoft)"/>
  </g>
</svg>
