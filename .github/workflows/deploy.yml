# Deploy isolado no KVM — NÃO sobe Nginx na 80/443
# Não altera configs de outros sites. Apenas atualiza /var/www/majeste

name: Deploy Majesté (isolado)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          passphrase: ${{ secrets.KVM_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.KVM_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR=/var/www/majeste; fi

            # Pasta exclusiva da Majesté — não mexe em outros projetos
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d .git ]; then
              git clone ${{ secrets.REPO_URL }} .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            if [ ! -f .env ]; then
              echo "ERRO: crie $APP_DIR/.env antes do deploy"
              exit 1
            fi

            # Só rebuilda o app web (volumes/rede isolados do project majeste)
            docker compose -p majeste up -d --build web
            docker compose -p majeste ps
            echo "OK: Majesté em 127.0.0.1:3001 (proxy do domínio precisa apontar para essa porta)"
