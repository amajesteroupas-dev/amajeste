# Deploy automático no Hostinger KVM via GitHub Actions
# Dispara em push na main. Configure os secrets no repositório.

name: Deploy KVM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          passphrase: ${{ secrets.KVM_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.KVM_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR=/var/www/majeste; fi
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -d .git ]; then
              git clone ${{ secrets.REPO_URL }} .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            if [ ! -f .env ]; then
              echo "ERRO: crie o arquivo .env no servidor em $APP_DIR/.env"
              exit 1
            fi
            docker compose pull || true
            docker compose build web
            docker compose up -d postgres redis
            sleep 5
            docker compose run --rm web npx prisma migrate deploy
            docker compose up -d web
            docker compose --profile production up -d nginx || true
            docker compose ps
            echo "Deploy concluído"
